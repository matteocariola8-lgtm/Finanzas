name: Genera Contenuto LinkedIn + Blog

on:
  schedule:
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze script
        working-directory: scripts
        run: npm install

      - name: Genera contenuto, immagine, pubblica su blog, notifica Make.com
        working-directory: .
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          SITE_BASE_URL: https://sagomafinanziaria.it
        run: node scripts/generate-linkedin-content.mjs

      - name: Commit e push modifiche
        if: always()
        run: |
          git config user.name "Sagoma Content Bot"
          git config user.email "actions@github.com"
          git add blog.html content/topics-history.json
          git add assets/social/ 2>/dev/null || true
          git diff --cached --quiet && echo "Nessuna modifica da committare" || git commit -m "🤖 Contenuto LinkedIn + articolo blog automatico"
          git push
