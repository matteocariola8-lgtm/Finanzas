[build]
  publish = "."

[[redirects]]
  from    = "https://www.sagomafinanziaria.it/*"
  to      = "https://sagomafinanziaria.it/:splat"
  status  = 301
  force   = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
